name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rebuilds the desk's inline copies, dev/ and cyber/ from portfolio/ and terminal/,
      # so the live site always matches the sources even if a local build was skipped.
      - run: python3 tools/build.py
      - run: |
          mkdir _site
          cp -r index.html .nojekyll audio awards books video dev cyber _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
